<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DISASTER RUN</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--ink:#2a1a12}*{box-sizing:border-box}*:not(input){touch-action:none;-webkit-user-select:none;user-select:none}
body{margin:0;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;color:#fff;background:#222}canvas{display:block}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#ffb060,#5a2e6e);z-index:5;text-align:center;padding:16px;text-shadow:0 2px 0 #0004;overflow:auto}
h1{font-size:clamp(40px,9vw,84px);margin:0;-webkit-text-stroke:4px var(--ink);paint-order:stroke;transform:rotate(-2deg)}.tag{font-weight:700;margin-top:-6px}
button,input{font:700 18px Fredoka,sans-serif;border:4px solid var(--ink);border-radius:16px;padding:8px 18px;color:var(--ink)}
button{background:#17a398;color:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-shadow:none}button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}button.alt{background:#e4572e}button.off{opacity:.55}button.sel{outline:4px solid #fff}
input{background:#fff;text-align:center;width:190px;-webkit-user-select:text!important;user-select:text!important;touch-action:auto!important;position:relative;z-index:10}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{border:4px solid var(--ink);border-radius:16px;padding:10px;width:150px;min-height:92px;font-weight:700;color:#fff;background:#0003}.err{color:#ffd0c0;min-height:24px;font-weight:700}
#hud{position:fixed;top:8px;left:8px;z-index:3;pointer-events:none;font-weight:700;text-shadow:0 2px 0 #000a;display:none}#stick{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff3;border:3px solid #fff8;display:none;z-index:4}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fffb}.mb{position:fixed;display:none;z-index:4;width:70px;height:70px;border-radius:50%;padding:0;font-size:20px}</style></head>
<body><div id="hud"></div><div id="stick"><div id="knob"></div></div><button class="mb" id="bJ" style="right:24px;bottom:30px">⤒</button><button class="mb alt" id="bR" style="right:104px;bottom:30px">🏃</button><div id="ui"></div><script type="module" src="/src/main.ts"></script></body></html>
